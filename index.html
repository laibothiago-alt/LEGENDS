<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGENDS</title><link rel="stylesheet" href="style.css"></head><body>
<main id="app"><section id="menu" class="screen active"><div class="menu-art"><img src="assets/menu.webp" alt="Menu LEGENDS"><div class="hotspots">
